<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>My Portfolio</h1>
    <p>Full Stack Web Development Intern</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#contact">Contact</a>
</nav>

<section id="home">
    <h2>Welcome</h2>
    <p>Welcome to my portfolio website.</p>

    <button onclick="welcomeMessage()">
        Click Me
    </button>
</section>

<section id="about">
    <h2>About Me</h2>

    <img src="images/profile.jpg"
         alt="Profile"
         width="200">

    <p>
        I am learning HTML, CSS, JavaScript,
        PHP and MySQL.
    </p>
</section>

<section id="skills">
    <h2>Skills</h2>

    <ul>
        <li>HTML5</li>
        <li>CSS3</li>
        <li>JavaScript</li>
        <li>PHP</li>
        <li>MySQL</li>
    </ul>
</section>

<section id="contact">
    <h2>Contact Form</h2>

    <form id="contactForm">

        <input type="text"
               id="name"
               placeholder="Enter Name"
               required>

        <input type="email"
               id="email"
               placeholder="Enter Email"
               required>

        <textarea id="message"
                  placeholder="Enter Message"></textarea>

        <br><br>

        <label>
            <input type="radio" name="gender">
            Male
        </label>

        <label>
            <input type="radio" name="gender">
            Female
        </label>

        <br><br>

        <label>
            <input type="checkbox" required>
            Accept Terms
        </label>

        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>
</section>

<footer>
    <p>© 2026 My Portfolio</p>
</footer>

<script src="script.js"></script>

</body>
</html>
